[pytest]
# 测试路径
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出格式
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试

# 日志配置
log_cli = false
log_cli_level = INFO

# 覆盖率配置
[coverage:run]
source = src
omit =
    tests/*
    */__init__.py
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:

# 跳过尚未实现的测试
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
